{% extends "base.html" %}
{% block title %}Create Account | Shree Khadapati Balaji Construction{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><p class="eyebrow">JOIN SHREE KHADAPATI BALAJI</p><h1>Create your account.</h1><p>Keep your construction enquiries connected in one place.</p>
<form method="post" class="form-grid">
<div class="field full"><label for="name">Full name</label><input id="name" name="name" maxlength="120" autocomplete="name" required></div>
<div class="field full"><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="190" autocomplete="email" required></div>
<div class="field full"><label for="password">Password (minimum 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field full"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="full"><button class="btn btn-primary btn-block" type="submit">Create account</button></div>
</form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></section>
{% endblock %}
