{% extends "base.html" %}
{% block title %}Login | Shree Khadapati Balaji Construction{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in.</h1><p>Access your Shree Khadapati Balaji Construction account.</p>
<form method="post" class="form-grid">
<div class="field full"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required></div>
<div class="field full">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
    <label for="password" style="margin-bottom:0;">Password</label>
    <a href="{{ url_for('forgot_password') }}" style="font-size:12px; color:var(--gold2, #c9933e); text-decoration:none; font-weight:700;">Forgot Password?</a>
  </div>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<div class="full"><button class="btn btn-primary btn-block" type="submit">Log in</button></div>
</form><p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create an account</a> &bull; <a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
</div></section>
{% endblock %}
